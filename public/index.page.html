locked: true
template: default
-->
<page title="Credits">
<content>
  <script type="module" src="/kempo-ui/components/Icon.js"></script>
  <script type="module" src="/credits/components/Balance.js"></script>
  <script type="module" src="/credits/components/History.js"></script>

  <h1 class="mb">Credits</h1>

  <div class="row">
    <div class="span-4 t-span-12 m-span-12 pr">
      <k-cred-balance id="balance"></k-cred-balance>
    </div>
  </div>

  <div id="send-section" hidden>
    <h2>Send credits</h2>
    <div class="row">
      <div class="span-4 t-span-12 m-span-12 pr">
        <k-cred-send id="send"></k-cred-send>
      </div>
    </div>
  </div>

  <h2 class="mt">History</h2>
  <k-cred-history id="history"></k-cred-history>

  <script type="module">
    import { getAllCurrentUserPermissions } from '/kempo/sdk.js';

    /*
      The send form is only offered to somebody who can use it. That is a courtesy: the route checks
      `credits:transfer` again and is the boundary that matters.
    */
    const [, data] = await getAllCurrentUserPermissions();
    if((data?.permissions || []).includes('credits:transfer')){
      await import('/credits/components/SendCredits.js');
      document.getElementById('send-section').hidden = false;

      // Sending changes the balance and the history, so both are re-read. A method causes the
      // refresh; the event only says it happened.
      document.getElementById('send').addEventListener('credits-sent', () => {
        document.getElementById('balance').refresh();
        document.getElementById('history').refresh();
      });
    }
  </script>
</content>
</page>
